<section class="counter">
  <h1>Count: {{ count }}</h1>
  <div class="buttons">
    <PlusButton :page="self" :step="1" @pressed="noted" />
    <PlusButton :page="self" step="10" />
    <button @click="add(-1)">-1</button>
    <button @click="reset">reset</button>
  </div>
  {% if count >= 10 %}<p class="big">That's a lot!</p>{% elif count < 0 %}<p>negative</p>{% end %}
  <p>last press: {{ last }}</p>
</section>
